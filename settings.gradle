pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// 构建产物名（jar 的文件名来自这里）。
// 注意：它<b>不是</b>模组的 id —— id 仍是 autofarm（见 src/main/resources/fabric.mod.json），
// 改 id 会让老玩家的 config/autofarm.json 和按键绑定全部失效，所以只改展示名。
rootProject.name = 'playerautofarming'
