# Gradle 自身的选项。
# 注意：mod 版本号、依赖版本、各 MC 版本的配置，全都搬到
# stonecutter.properties.toml 里了 —— 那里才是「一份源码喂给多个版本」的入口。

# 3G：Loom 给依赖做 remap（Mod Menu 这类带 jar-in-jar 的模组）比较吃内存，
# 1G 会在「守护进程突然消失」这一档上翻车。多版本工程更吃内存，别往下调。
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# 关闭 configuration cache。
# 官方模板默认开着它，但那是建立在「构建脚本足够简单」的前提上的：
# 我们在 processResources 里用了 Groovy 的 expand() 来注入版本号，
# 这个扩展会持有 Gradle 脚本对象引用，而 configuration cache 要求任务捕获的
# 一切都能序列化 —— 直接报
#   "cannot serialize Gradle script object references"
# 让整个 build 失败（jar 其实已经产出了，只是最后这一步过不去）。
#
# 它的收益是「第二次构建跳过配置阶段」，在这个项目规模下省不了几秒；
# 代价却是每次写构建脚本都要跟序列化规则搏斗。不划算。
org.gradle.configuration-cache=false

# 网络：maven.fabricmc.net 在国内走 Cloudflare，偶发连接超时
# （现象是 "Connect to maven.fabricmc.net:443 failed: Connection timed out"，
#  一次握手失败就让整个构建挂掉）。
# 把连接/读取超时放宽，给慢链路一点余地。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# 多版本工程一次要下载几十个依赖（23 个版本 × 各自一套 MC + Fabric API），
# Gradle 默认的 HTTP 超时偏短，网络稍一波动就会「下载 3 次失败 → 整个构建失败」。
# 放宽到 60 秒，让它有时间重试完。
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
