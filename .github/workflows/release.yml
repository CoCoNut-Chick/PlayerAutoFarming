# 推一个 tag（形如 v2.4.1）就自动发一个 Release，并把构建好的 jar 挂上去。
#
# 为什么放在 CI 里发，而不是在本机敲命令：
#   1. 创建 Release 需要 GitHub API 凭据（Token）；本机到 GitHub 只有 443 的 SSH 通，
#      走 API 还得额外配 Token，交给 runner 最省事；
#   2. 顺手保证「Release 里的 jar」一定是**这个 tag 的源码**跑出来的，
#      不会出现「本地构建物和 tag 对不上」这种最坑人的情况。
#
# 用法：
#   git tag -a v2.4.1 -m "..." && git push origin v2.4.1
# 之后 Actions 会构建、发 Release；下载页链接形如
#   https://github.com/<owner>/<repo>/releases/tag/v2.4.1

name: release

on:
  push:
    tags:
      - 'v*'

# 发 Release 要写仓库内容，GITHUB_TOKEN 默认可能只有读权限，这里显式提权
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          # 和 build.yml / 本地开发保持一致（见 build.yml 里的说明）
          java-version: '21'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      # 只把「能直接丢进 mods/ 的那个 jar」挑出来：
      # build/libs 下还有 *-sources.jar（源码包）和旧版本残留，别一起传上去迷惑人。
      - name: pick the mod jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/notes.md <<EOF
          ### 下载 / Download

          把 \`${{ steps.jar.outputs.file }}\` 丢进 \`.minecraft/mods/\` 就行。
          Drop \`${{ steps.jar.outputs.file }}\` into \`.minecraft/mods/\`.

          **需要 / Requires**：Fabric Loader 0.19.5+ · Fabric API（1.20.1）· Minecraft 1.20.1

          装完进游戏，按键绑定里能找到「开关自动收割」的快捷键（默认 \` 键）。
          改了什么见仓库里的 \`CHANGELOG.md\`。
          EOF

          gh release create "$TAG" "${{ steps.jar.outputs.path }}" \
            --title "PlayerAutoFarming ${TAG#v}" \
            --generate-notes \
            --notes-file /tmp/notes.md
